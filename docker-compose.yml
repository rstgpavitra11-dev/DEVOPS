services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-demo-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks} -d ${POSTGRES_DB:-tasks}"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    image: fullstack-demo-api:${IMAGE_TAG:-local}
    build: ./api
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-tasks}
      DB_USER: ${POSTGRES_USER:-tasks}
      DB_PASSWORD: ${APP_DB_PASSWORD:-change-this-local-demo-password}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
  web:
    image: fullstack-demo-web:${IMAGE_TAG:-local}
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"
volumes:
  pgdata:

